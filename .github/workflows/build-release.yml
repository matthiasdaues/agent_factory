---
name: Build and publish release assets

on:
  push:
    tags:
      - "v*"
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build release assets
        run: |
          packages/factory/scripts/build-release --output ./release/
        shell: bash

      - name: Read version
        id: version
        run: |
          VERSION=$(cat packages/factory/VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create GitHub release (tag push on main)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/install-agent-factory
            release/agent-factory.tar.gz
            release/SHA256SUMS

      - name: Create GitHub pre-release (dev push)
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          prerelease: true
          files: |
            release/install-agent-factory
            release/agent-factory.tar.gz
            release/SHA256SUMS
