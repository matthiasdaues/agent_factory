[project]
name = "agent-factory"
version = "0.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spec(id): traces a test to its ACX-* contract-owner row in docs/spec/agent-context-qa-strategy.md",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLW1510", "RUF012"]
