---
extends: relaxed

# A run receipt is a frozen copy of a dispatch ledger, which dispatch writes;
# its line lengths are the ledger's, not the author's.
ignore: |
  docs/reviews/runs/

rules:
  line-length:
    max: 500
    allow-non-breakable-inline-mappings: true
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: enable
