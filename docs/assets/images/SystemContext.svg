609)" style=""><g  id="v-155" style="opacity: 1;"><rect  id="v-156" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#999999" stroke="#8a8a8a" stroke-dasharray="" width="450" height="300" style="fill: rgb(153, 153, 153); stroke: rgb(138, 138, 138);"></rect><text  id="v-157" font-size="33.599999999999994px" xml:space="preserve" y="14.900000000000006" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(255, 255, 255);"><tspan dy="0" >Orchestrator-as-Trigger</tspan></text><text  id="v-158" font-size="16.799999999999997px" xml:space="preserve" y="56.5" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >[Software System]</tspan></text><text  id="v-159" font-size="24px" xml:space="preserve" y="88.3" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >The nested orchestrator/ Python</tspan><tspan dy="1.2em" x="0" >CLI. A peer of the Human Operator</tspan><tspan dy="1.2em" x="0" >— invokes the same factory</tspan><tspan dy="1.2em" x="0" >mechanisms programmatically</tspan><tspan dy="1.2em" x="0" >instead of a human typing them.</tspan><tspan dy="1.2em" x="0" >Holds no flow-control state of its</tspan><tspan dy="1.2em" x="0" >own.</tspan></text><g  id="v-160" color="#ffffff" transform="matrix(1,0,0,1,222.5,268)" display="none" style="fill: rgb(255, 255, 255);"><g ></g><g ></g><g ></g><g ></g></g><image  id="v-161"></image></g></g><!--z-index:15--><g   id="j_16"  transform="translate(1779,609)" style=""><g  id="v-168" style="opacity: 1;"><rect  id="v-169" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#999999" stroke="#8a8a8a" stroke-dasharray="" width="450" height="300" style="fill: rgb(153, 153, 153); stroke: rgb(138, 138, 138);"></rect><text  id="v-170" font-size="33.599999999999994px" xml:space="preserve" y="43.70000000000002" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(255, 255, 255);"><tspan dy="0" >CLI-Invoked Agent</tspan></text><text  id="v-171" font-size="16.799999999999997px" xml:space="preserve" y="85.30000000000001" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >[Software System]</tspan></text><text  id="v-172" font-size="24px" xml:space="preserve" y="117.10000000000001" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >The Claude Code or Copilot CLI</tspan><tspan dy="1.2em" x="0" >session that trigger dispatches,</tspan><tspan dy="1.2em" x="0" >operating under the scoped</tspan><tspan dy="1.2em" x="0" >permission allowlist trigger</tspan><tspan dy="1.2em" x="0" >constructs for it.</tspan></text><g  id="v-173" color="#ffffff" transform="matrix(1,0,0,1,222.5,268)" display="none" style="fill: rgb(255, 255, 255);"><g ></g><g ></g><g ></g><g ></g></g><image  id="v-174"></image></g></g><!--z-index:16--><g   id="j_17"  transform="translate(199,959)" style=""><g  id="v-181" style="opacity: 1;"><rect  id="v-182" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#999999" stroke="#8a8a8a" stroke-dasharray="" width="450" height="300" style="fill: rgb(153, 153, 153); stroke: rgb(138, 138, 138);"></rect><text  id="v-183" font-size="33.599999999999994px" xml:space="preserve" y="43.70000000000002" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(255, 255, 255);"><tspan dy="0" >git / pre-commit</tspan></text><text  id="v-184" font-size="16.799999999999997px" xml:space="preserve" y="85.30000000000001" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >[Software System]</tspan></text><text  id="v-185" font-size="24px" xml:space="preserve" y="117.10000000000001" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >The host git repository and its</tspan><tspan dy="1.2em" x="0" >pre-commit hook set. Invokes</tspan><tspan dy="1.2em" x="0" >transition-lint and the guardrail hook</tspan><tspan dy="1.2em" x="0" >at the moments a git operation fires.</tspan><tspan dy="1.2em" x="0" >Has no goal of its own.</tspan></text><g  id="v-186" color="#ffffff" transform="matrix(1,0,0,1,222.5,268)" display="none" style="fill: rgb(255, 255, 255);"><g ></g><g ></g><g ></g><g ></g></g><image  id="v-187"></image></g></g><!--z-index:17--><g   id="j_18"  transform="translate(989,609)" style=""><g  id="v-194" style="opacity: 1;"><rect  id="v-195" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#1168bd" stroke="#0f5eaa" stroke-dasharray="" width="450" height="300" style="fill: rgb(17, 104, 189); stroke: rgb(15, 94, 170);"></rect><text  id="v-196" font-size="33.599999999999994px" xml:space="preserve" y="14.900000000000006" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(255, 255, 255);"><tspan dy="0" >Factory Flow Control</tspan></text><text  id="v-197" font-size="16.799999999999997px" xml:space="preserve" y="56.5" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >[Software System]</tspan></text><text  id="v-198" font-size="24px" xml:space="preserve" y="88.3" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >Gates which files may be staged in</tspan><tspan dy="1.2em" x="0" >which playbook phase, advances a</tspan><tspan dy="1.2em" x="0" >run only when entry conditions hold,</tspan><tspan dy="1.2em" x="0" >caps retry loops, and dispatches</tspan><tspan dy="1.2em" x="0" >agents under a scoped allowlist —</tspan><tspan dy="1.2em" x="0" >all from observable, git-ignored local</tspan><tspan dy="1.2em" x="0" >state.</tspan></text><g  id="v-199" color="#ffffff" transform="matrix(1,0,0,1,210,268)" display="none" style="fill: rgb(255, 255, 255);"><g  transform="translate(5 0)"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z"></path><path d="M10.344 11.742c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1 6.538 6.538 0 0 1-1.398 1.4z"></path><path fill-rule="evenodd" d="M6.5 3a.5.5 0 0 1 .5.5V6h2.5a.5.5 0 0 1 0 1H7v2.5a.5.5 0 0 1-1 0V7H3.5a.5.5 0 0 1 0-1H6V3.5a.5.5 0 0 1 .5-.5z"></path></svg></g><g ></g><g ></g><g ></g></g><image  id="v-200"></image></g></g><!--z-index:18--><g   id="j_19"  style="opacity: 1;"><path f