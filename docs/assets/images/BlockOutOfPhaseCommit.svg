255);"><tspan dy="0" >Phase-ordering gate: blocks a</tspan><tspan dy="1.2em" x="0" >staged file whose declared state</tspan><tspan dy="1.2em" x="0" >differs from the marker's current</tspan><tspan dy="1.2em" x="0" >state. Never evaluates</tspan><tspan dy="1.2em" x="0" >entry_conditions — that is phase</tspan><tspan dy="1.2em" x="0" >advance's job alone.</tspan></text><g  id="v-789" color="#ffffff" transform="matrix(1,0,0,1,222.5,268)" display="none" style="fill: rgb(255, 255, 255);"><g ></g><g ></g><g ></g><g ></g></g><image  id="v-790"></image></g></g><!--z-index:16--><g   id="j_73"  transform="translate(1830,192)" style=""><g  id="v-799" style="opacity: 1;"><path  d="M 0,30 a 225,30 0,0,0 450 0 a 225,30 0,0,0 -450 0 l 0,240 a 225,30 0,0,0 450 0 l 0,-240" id="v-800" stroke-width="2" pointer-events="visiblePainted" fill="#438dd5" stroke="#3c7fc0" stroke-dasharray="" style="fill: rgb(67, 141, 213); stroke: rgb(60, 127, 192);"></path><rect  id="v-801" stroke-width="0" pointer-events="visiblePainted" fill="none" stroke="none" width="450" height="270" x="0" y="30"></rect><text  id="v-802" font-size="33.599999999999994px" xml:space="preserve" y="73.10000000000001" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(255, 255, 255);"><tspan dy="0" >Marker</tspan></text><text  id="v-803" font-size="16.799999999999997px" xml:space="preserve" y="114.7" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >[Container: Filesystem (YAML)]</tspan></text><text  id="v-804" font-size="24px" xml:space="preserve" y="146.5" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="displ