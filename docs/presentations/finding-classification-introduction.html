# Finding Classification

An introduction for developers who use the factory.

---

# AI agents check the work and report problems

In the factory, AI agents write the code, and other AI agents review it.

A **run** is one piece of work, from the plan to the merged code.

When a reviewer sees a problem, it writes a **finding**. A finding is a short file that says what is wrong and how to fix it.

Every finding also says how serious the problem is. We call this its **severity**.

---

class: dense

# Every finding has one of four severities

| Severity | What it means | What the run does | What you do |
| --- | --- | --- | --- |
| .crit[critical] | The problem is in work that is already in use, so it may have caused damage. | The run stops. | You check the damage and confirm the stop. |
| .major[major] | The work does not do its job. | The agent that wrote the work has to fix it. | You wait for the fix. |
| .minor[minor] | The work does its job, but later changes will cost more. | The run continues. | You read the reason in the final summary. |
| .note[note] | Nothing needs to change. | The run continues. | You do nothing. |

---

class: dense

# The reviewer answers fixed questions

Reviewers used to choose a word such as "significant". Two reviews of the same work could then give different results.

Now the reviewer answers fixed questions about the problem, and the answers are saved in the finding.

A fixed rule then turns the answers into the severity. The same answers always give the same severity.

Fixed questions alone are not enough. In a test, two AI models each answered the same question in their own way. So where a question leaves room, the rules list named cases. The reviewer picks the case that fits and records it in the finding.

---

class: dense

# Most findings use three questions

Suppose a review finds that your new command prints the wrong total. Your change exists only on your feature branch.

| The reviewer asks | "Yes" gives | In this case |
| --- | --- | --- |
| Does the problem cause harm in work that is already in use? | .crit[critical] | No. Only your branch has this code. |
| Does the work fail its own purpose? | .major[major] | Yes. The total must be right. |
| Does it only make later work harder? | .minor[minor] | No. |

The first "yes" sets the severity, so this finding is .major[major]. Three "no" answers give .note[note].

---

# Security and architecture use other questions

For a security problem, the reviewer asks what an attacker can gain and what the attacker must already have. The reviewer also records whether the attack is proven.

For an architecture problem, the reviewer asks how important the threatened quality goal is. The reviewer also records whether the design fails that goal or whether nobody has checked.

These findings end on the same four severities.

---

class: dense

# You can check every severity

At each commit, the script `finding-lint` calculates the severity again from the saved answers. If the result does not match, the commit fails.

The script cannot tell whether an answer is right. An AI reviewer can answer wrongly, and two AI reviewers can each answer in a steady way and still answer differently. So please open a finding and read its answers and the case it names.

Only a person can accept a .major[major] or .crit[critical] finding without a fix. An AI agent cannot do this.

You can read the full rules in [finding-classification.md](../../packages/factory/rulebooks/conventions/finding-classification.md).
