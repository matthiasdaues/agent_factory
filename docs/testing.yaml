---
# Code is the source of truth. Re-run the detect-test-regime skill when the
# project's test setup changes.

testing_strategy: .agent-factory/factory/rulebooks/conventions/testing-strategy.md

test_all: 'uv run pytest --tb=short --quiet -n auto -m "not container" && node --experimental-strip-types --import ./packages/factory/config/extensions/__tests__/envelope-loader.mjs --test "packages/factory/config/**/*.test.ts"'

# Compatibility commands consumed by the repository's test-command guard.
test_command: 'uv run pytest --tb=short --quiet -n auto -m "not container"'
test_staged_command: 'uv run pytest --tb=short --quiet -n auto -m "not container"'

suites:
  - name: default
    framework: pytest
    run_all: 'uv run pytest --tb=short --quiet -n auto -m "not container"'
    run_file: "uv run pytest --tb=short --quiet {file}"
    run_match: "uv run pytest --tb=short --quiet -k {pattern}"
    root: tests
    pattern: "test_*.py"
    markers: [spec, container]
    prerequisites: null
  - name: usage
    framework: pytest
    run_all: null
    run_file: null
    run_match: null
    root: packages/usage/tests
    pattern: "test_*.py"
    markers: []
    prerequisites: null
  - name: factory-package
    framework: pytest
    run_all: null
    run_file: null
    run_match: null
    root: packages/factory/tests
    pattern: "test_*.py"
    markers: []
    prerequisites: null
  # The TypeScript tests of the Pi extensions and the OpenCode plugin (DEC-62,
  # ADR-0036). The loader stubs the Pi runtime imports. Run from the
  # repository root.
  - name: typescript
    framework: node:test
    run_all: 'node --experimental-strip-types --import ./packages/factory/config/extensions/__tests__/envelope-loader.mjs --test "packages/factory/config/**/*.test.ts"'
    run_file: "node --experimental-strip-types --import ./packages/factory/config/extensions/__tests__/envelope-loader.mjs --test {file}"
    run_match: 'node --experimental-strip-types --import ./packages/factory/config/extensions/__tests__/envelope-loader.mjs --test --test-name-pattern {pattern} "packages/factory/config/**/*.test.ts"'
    root: packages/factory/config
    pattern: "*.test.ts"
    markers: []
    prerequisites: "Node 22.6 or later; no package to install"

layers:
  deterministic_linter:
    tool: custom
    infrastructure: standalone scripts
    entry_point: "packages/usage/scripts/usage-contract-check"
  contract_test:
    tool: pytest
    infrastructure: mock
    entry_point: "uv run pytest --tb=short --quiet tests/"
  integration_test:
    tool: pytest
    infrastructure: real filesystem and subprocess
    entry_point: "uv run pytest --tb=short --quiet tests/"
  end_to_end:
    tool: pytest
    infrastructure: real filesystem, subprocess, and temporary Git repositories
    entry_point: "uv run pytest --tb=short --quiet tests/factory/test_onboarding_journey.py"

# Preserved from the former testing charter; these gates were not part of the
# regime scan.
gates:
  crap_score:
    enabled: false
    threshold: 8
  mutation_testing:
    enabled: false

risk_classes:
  critical:
    format: forbidden
    budget: unbounded
  standard:
    format: scenario
    budget: equivalence
  structural:
    format: linter
