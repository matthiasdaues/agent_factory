---
# Code is the source of truth. Re-run the detect-test-regime skill when the
# project's test setup changes.

testing_strategy: .agent-factory/factory/rulebooks/conventions/testing-strategy.md

test_all: 'uv run pytest --tb=short --quiet -n auto -m "not container and not opencode_session" && node --experimental-strip-types --import ./packages/factory/config/extensions/__tests__/envelope-loader.mjs --test "packages/factory/config/**/*.test.ts"'

# Compatibility commands consumed by the repository's test-command guard.
test_command: 'uv run pytest --tb=short --quiet -n auto -m "not container and not opencode_session"'
test_staged_command: 'uv run pytest --tb=short --quiet -n auto -m "not container and not opencode_session"'
# The story merge of premerge-check appends the changed paths. The selector
# runs only the test files those paths affect.
test_changed_command: "python3 tests/select_tests.py --run"

suites:
  - name: default
    framework: pytest
    run_all: 'uv run pytest --tb=short --quiet -n auto -m "not container and not opencode_session"'
    run_file: "uv run pytest --tb=short --quiet {file}"
    run_match: "uv run pytest --tb=short --quiet -k {pattern}"
    root: tests
    pattern: "test_*.py"
    markers: [spec, container, opencode_session]
    prerequisites: null
  - name: usage
    framework: pytest
    run_all: null
    run_file: null
    run_match: null
    root: packages/usage/tests
    pattern: "test_*.py"
    markers: []
    prerequisites: null
  - name: factory-package
    framework: pytest
    run_all: null
    run_file: null
    run_match: null
    root: packages/factory/tests
    pattern: "test_*.py"
    markers: []
    prerequisites: null
  # The TypeScript tests of the Pi extensions and the OpenCode plugin (DEC-62,
  # ADR-0036). The loader stubs the Pi runtime imports. Run from the
  # repository root.
  - name: typescript
    framework: node:test
    run_all: 'node --experimental-strip-types --import ./packages/factory/config/extensions/__tests__/envelope-loader.mjs --test "packages/factory/config/**/*.test.ts"'
    run_file: "node --experimental-strip-types --import ./packages/factory/config/extensions/__tests__/envelope-loader.mjs --test {file}"
    run_match: 'node --experimental-strip-types --import ./packages/factory/config/extensions/__tests__/envelope-loader.mjs --test --test-name-pattern {pattern} "packages/factory/config/**/*.test.ts"'
    root: packages/factory/config
    pattern: "*.test.ts"
    markers: []
    prerequisites: "Node 22.6 or later; no package to install"

layers:
  deterministic_linter:
    tool: custom
    infrastructure: standalone scripts
    entry_point: "packages/usage/scripts/usage-contract-check"
  contract_test:
    tool: pytest
    infrastructure: mock
    entry_point: "uv run pytest --tb=short --quiet tests/"
  integration_test:
    tool: pytest
    infrastructure: real filesystem and subprocess
    entry_point: "uv run pytest --tb=short --quiet tests/"
  end_to_end:
    tool: pytest
    infrastructure: real filesystem, subprocess, and temporary Git repositories
    entry_point: "uv run pytest --tb=short --quiet tests/factory/test_onboarding_journey.py"

# Preserved from the former testing charter; these gates were not part of the
# regime scan.
gates:
  # Set up by setup-crap-score (ST-0449). Both measuring commands run the
  # tests from the repository root and need no running service.
  crap-score:
    enabled: true
    threshold: 30
    timeout_minutes: 20
    measured_minutes: 12
    measures:
      - name: python
        files: "packages/factory/scripts/*"
        exclude:
          # No test runs it yet; a follow-up story tests it and switches it to uv run (DEC-86).
          - "packages/factory/scripts/generate-codex-agents"
          # No test runs it yet; a follow-up story tests it and switches it to uv run (DEC-86).
          - "packages/factory/scripts/generate-copilot-agents"
          # No test runs it yet; a follow-up story tests it and switches it to uv run (DEC-86).
          - "packages/factory/scripts/openrouter-discover"
          # No test runs it yet; a follow-up story tests it and switches it to uv run (DEC-86).
          - "packages/factory/scripts/policy-validate"
          # No test runs it yet; a follow-up story tests it and switches it to uv run (DEC-86).
          - "packages/factory/scripts/resolve-model"
          # No test runs it yet; a follow-up story tests it and switches it to uv run (DEC-86).
          - "packages/factory/scripts/session-reconcile"
          # No test runs it yet; a follow-up story tests it and switches it to uv run (DEC-86).
          - "packages/factory/scripts/usage-capture-lifecycle"
          # No test runs it yet; a follow-up story tests it and switches it to uv run (DEC-86).
          - "packages/factory/scripts/usage-query"
        command: "scripts/crap-measure-python"
      - name: typescript
        files: "packages/factory/config/**/*.ts"
        exclude:
          # Test files and the test loader, not product code.
          - "**/__tests__/**"
        command: "scripts/crap-measure-typescript"
  mutation-testing:
    enabled: false

# Read by `dispatch merge-story` in an orchestrated run (BR-124). With true,
# merge-story refuses a new merge while the worktree of the feature branch
# holds an uncommitted change to a tracked file. A missing key means true.
dispatch:
  refuse_dirty_feature_worktree: true

risk_classes:
  critical:
    format: forbidden
    budget: unbounded
  standard:
    format: scenario
    budget: equivalence
  structural:
    format: linter
