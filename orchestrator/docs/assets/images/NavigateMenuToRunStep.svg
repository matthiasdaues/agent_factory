nt-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >Concrete MenuRenderer: paints one</tspan><tspan dy="1.2em" x="0" >menu or display node at a time with</tspan><tspan dy="1.2em" x="0" >the -&gt; cursor and star default, and</tspan><tspan dy="1.2em" x="0" >normalizes keypresses to</tspan><tspan dy="1.2em" x="0" >KeyEvents.</tspan></text><g  id="v-1477" color="#ffffff" transform="matrix(1,0,0,1,222.5,268)" display="none" style="fill: rgb(255, 255, 255);"><g ></g><g ></g><g ></g><g ></g></g><image  id="v-1478"></image></g></g><!--z-index:18--><g   id="j_121"  transform="translate(299,242)" style=""><g  id="v-1434" style="opacity: 1;"><rect  id="v-1435" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#85bbf0" stroke="#78a8d8" stroke-dasharray="" width="450" height="300" style="fill: rgb(133, 187, 240); stroke: rgb(120, 168, 216);"></rect><text  id="v-1436" font-size="33.599999999999994px" xml:space="preserve" y="72.5" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#000000" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(0, 0, 0);"><tspan dy="0" >Command Dispatcher</tspan></text><text  id="v-1437" font-size="16.799999999999997px" xml:space="preserve" y="114.1" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#000000" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(0, 0, 0);"><tspan dy="0" >[Component: argparse]</tspan></text><text  id="v-1438" font-size="24px" xml:space="preserve" y="145.89999999999998" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#000000" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(0, 0, 0);"><tspan dy="0" >Maps argv to an application service;</tspan><tspan dy="1.2em" x="0" >validates arguments; owns process</tspan><tspan dy="1.2em" x="0" >exit codes.</tspan></text><g  id="v-1439" color="#000000" transform="matrix(1,0,0,1,222.5,268)" display="none" style="fill: rgb(0, 0, 0);"><g ></g><g ></g><g ></g><g ></g></g><image  id="v-1440"></image></g></g><!--z-index:19--><g   id="j_124"  transform="translate(1189,242)" style=""><g  id="v-1454" style="opacity: 1;"><rect  id="v-1455" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#85bbf0" stroke="#78a8d8" stroke-dasharray="" width="450" height="300" style="fill: rgb(133, 187, 240); stroke: rgb(120, 168, 216);"></rect><text  id="v-1456" font-size="33.599999999999994px" xml:space="preserve" y="-42.69999999999999" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#000000" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(0, 0, 0);"><tspan dy="0" >MenuController</tspan></text><text  id="v-1457" font-size="16.799999999999997px" xml:space="preserve" y="-1.0999999999999943" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#000000" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(0, 0, 0);"><tspan dy="0" >[Component: Python]</tspan></text><text  id="v-1458" font-size="24px" xml:space="preserve" y="30.700000000000003" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#000000" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(0, 0, 0);"><tspan dy="0" >Traverses the menu tree, tracks</tspan><tspan dy="1.2em" x="0" >navigation state, and dispatches</tspan><tspan dy="1.2em" x="0" >each function leaf to the same</tspan><tspan dy="1.2em" x="0" >application service as its</tspan><tspan dy="1.2em" x="0" >direct-mode equivalent; hands</tspan><tspan dy="1.2em" x="0" >long-running operations back to the</tspan><tspan dy="1.2e