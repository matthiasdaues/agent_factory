<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1840" height="1229" style="width: 1840px; height: 1229px; background: #ffffff" viewBox="0 0 1840 1229"><style id="v-3" type="text/css">        .joint-element .scalable * {            vector-effect: non-scaling-stroke;        }    </style><defs joint-selector="defs"><marker id="v-21252848929" orient="auto" overflow="visible" markerUnits="userSpaceOnUse"><path id="v-88" stroke="#444444" fill="#444444" transform="rotate(180)" d="M 20 -10 0 0 20 10 Z"></path></marker></defs><g joint-selector="layers"  transform="matrix(1,0,0,1,0,0)"><g  style="pointer-events: none;"></g><g ></g><g  style="user-select: none;"><!--z-index:0--><!--z-index:1--><!--z-index:2--><!--z-index:3--><!--z-index:4--><!--z-index:5--><!--z-index:6--><!--z-index:7--><!--z-index:8--><!--z-index:9--><g   id="j_146"  transform="translate(20,1185)"><g id="v-1693"><text  id="v-1694" font-size="24px" xml:space="preserve" y="0.8em" font-weight="normal" text-anchor="start" fill="#444444" pointer-events="none" display="block" font-family="Tahoma, Verdana, Helvetica, Arial"><tspan dy="0" >Saturday, July 11, 2026 at 10:33 PM Coordinated Universal Time</tspan></text></g></g><!--z-index:10--><g   id="j_145"  transform="translate(20,1151)"><g id="v-1691"><text  id="v-1692" font-size="24px" xml:space="preserve" y="0.8em" font-weight="normal" text-anchor="start" fill="#444444" pointer-events="none" display="block" font-family="Tahoma, Verdana, Helvetica, Arial"><tspan dy="0" >An operator checks status mid-loop while factory drives the author-reviewer cycle (UC-05).</tspan></text></g></g><!--z-index:11--><g   id="j_144"  transform="translate(20,1105)"><g id="v-1689"><text  id="v-1690" font-size="36px" xml:space="preserve" y="0.8em" font-weight="normal" text-anchor="start" fill="#444444" pointer-events="none" display="block" font-family="Tahoma, Verdana, Helvetica, Arial"><tspan dy="0" >Dynamic View: Agent Session Orchestrator - Orchestration Core</tspan></text></g></g><!--z-index:12--><g   id="j_149"  transform="translate(199,143)" style="; opacity: 1;"><g id="v-1710"><rect  id="v-1711" width="1440" height="829" rx="20" ry="20" stroke-width="2" pointer-events="none" stroke="#0f5eaa" fill="#ffffff" opacity="1" stroke-dasharray=""></rect><text  id="v-1712" font-size="33.599999999999994px" xml:space="preserve" y="790" font-weight="bold" text-anchor="start" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#1168bd" transform="matrix(1,0,0,1,15,0)"><tspan dy="0" >Agent Session Orchestrator</tspan></text><text  id="v-1713" font-size="16.799999999999997px" xml:space="preserve" y="814" font-weight="normal" text-anchor="start" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#1168bd" transform="matrix(1,0,0,1,15,0)"><tspan dy="0" >[Software System]</tspan></text><image  id="v-1714" pointer-events="visible"></image></g></g><!--z-index:13--><g   id="j_148"  transform="translate(249,318)" style="; opacity: 1;"><g id="v-1705"><rect  id="v-1706" width="550" height="479" rx="20" ry="20" stroke-width="2" pointer-events="none" stroke="#3c7fc0" fill="#ffffff" opacity="1" stroke-dasharray=""></rect><text  id="v-1707" font-size="33.599999999999994px" xml:space="preserve" y="440" font-weight="bold" text-anchor="start" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#438dd5" transform="matrix(1,0,0,1,15,0)"><tspan dy="0" >Orchestration Core</tspan></text><text  id="v-1708" font-size="16.799999999999997px" xml:space="preserve" y="464" font-weight="normal" text-anchor="start" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#438dd5" transform="matrix(1,0,0,1,15,0)"><tspan dy="0" >[Container]</tspan></text><image  id="v-1709" pointer-events="visible"></image></g></g><!--z-index:14--><g   id="j_150"  transform="translate(1139,193)" style=""><g  id="v-1724" style="opacity: 1;"><rect  id="v-1725" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#438dd5" stroke="#3c7fc0" stroke-dasharray="" width="450" height="300" style="fill: rgb(67, 141, 213); stroke: rgb(60, 127, 192);"></rect><text  id="v-1726" font-size="33.599999999999994px" xml:space="preserve" y="43.70000000000002" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(255, 255, 255);"><tspan dy="0" >Findings Store Adapter</tspan></text><text  id="v-1727" font-size="16.799999999999997px" xml:space="preserve" y="85.30000000000001" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >[Container: Python / jsonschema]</tspan></text><text  id="v-1728" font-size="24px" xml:space="preserve" y="117.10000000000001" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >File-per-finding JSON store with a</tspan><tspan dy="1.2em" x="0" >monotonic ID allocator; validates</tspan><tspan dy="1.2em" x="0" >every finding against the schema on</tspan><tspan dy="1.2em" x="0" >write. Read today by status views;</tspan><tspan dy="1.2em" x="0" >ingestion is factory's job.</tspan></text><g  id="v-1729" color="#ffffff" transform="matrix(1,0,0,1,222.5,268)" display="none" style="fill: rgb(255, 255, 255);"><g ></g><g ></g><g ></g><g ></g></g><image  id="v-1730"></image></g></g><!--z-index:15--><g   id="j_151"  transform="translate(1139,543)" style=""><g  id="v-1734" style="opacity: 1;"><rect  id="v-1735" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#438dd5" stroke="#3c7fc0" stroke-dasharray="" width="450" height="300" style="fill: rgb(67, 141, 213); stroke: rgb(60, 127, 192);"></rect><text  id="v-1736" font-size="33.599999999999994px" xml:space="preserve" y="29.30000000000001" font-weight="bold" text-anchor="middle" pointer-events="visible" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="fill: rgb(255, 255, 255);"><tspan dy="0" >Run State Store</tspan></text><text  id="v-1737" font-size="16.799999999999997px" xml:space="preserve" y="70.9" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >[Container: Python / json]</tspan></text><text  id="v-1738" font-size="24px" xml:space="preserve" y="102.7" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" fill="#ffffff" dominant-baseline="hanging" transform="matrix(1,0,0,1,225,0)" style="display: block; fill: rgb(255, 255, 255);"><tspan dy="0" >Atomic (write-then-rename)</tspan><tspan dy="1.2em" x="0" >reader/writer of</tspan><tspan dy="1.2em" x="0" >.orchestrator/run.json and the run</tspan><tspan dy="1.2em" x="0" >lock. Does not manage git branches</tspan><tspan dy="1.2em" x="0" >— factory creates and selects the</tspan><tspan dy="1.2em" x="0" >run branch during execution.</tspan></text><g  id="v-1739" color="#ffffff" transform="matrix(1,0,0,1,222.5,268)" display="none" style="fill: rgb(255, 255, 255);"><g ></g><g ></g><g ></g><g ></g></g><image  id="v-1740"></image></g></g><!--z-index:16--><g   id="j_147"  transform="translate(299,368)" style=""><g  id="v-1698" style="opacity: 1;"><rect  id="v-1699" rx="20" ry="20" stroke-width="2" pointer-events="visiblePainted" fill="#85bbf0" stroke="#78a8d8" stroke-dasharray="" width="450" height="300" style="fill: rgb(133, 187, 240); stroke: rgb(120, 168, 216);"></rect><text  id="v-1700" font-size="33.599999999999994px" xml:space="prese