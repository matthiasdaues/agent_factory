# Pre-commit hooks for Agent Factory projects.
# Copied verbatim by `orchestrate init` — paths are relative to what `orchestrate
# init` itself creates in the target project: a flat scripts/ directory and a
# flat model.conf (see cli.py's `_COPY_DIRS`/`_handle_init`), NOT
# agent_factory's own nested factory/scripts + config/ layout, which is a
# different bootstrap mechanism (`init-factory`) with its own conventions.
# See: docs/spec/supplementary_specs/interface-contracts.md

repos:
  - repo: local
    hooks:
      # formats all markdown files
      - id: mdformat
        name: mdformat
        entry: uv run mdformat
        language: system
        types: [markdown]

      # lints all python files
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]

      # lints python code blocks in markdown
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        
      - id: spec-lint
        name: spec-lint (specification consistency & traceability)
        entry: python3 scripts/spec-lint
        language: system
        pass_filenames: false
        files: ^docs/spec/

      - id: arch-lint
        name: arch-lint (arc42 <-> Structurizr consistency)
        entry: python3 scripts/arch-lint --docs-dir docs --no-validate
        language: system
        pass_filenames: false
        files: ^docs/(architecture\.dsl|05_building_block_view\.md|assets/images/.*)$

      - id: backlog-lint
        name: backlog-lint (story schema & traceability gate)
        entry: python3 scripts/backlog-lint --backlog-dir backlog
        language: system
        pass_filenames: false
        files: ^backlog/ST-.*\.md$

      - id: matrix-lint
        name: matrix-lint (model matrix consistency gate)
        entry: python3 scripts/matrix-lint --matrix model.conf
        language: system
        pass_filenames: false
        files: ^model\.conf$

      - id: statemachine-lint
        name: statemachine-lint (pseudocode ↔ Mermaid consistency)
        entry: python3 scripts/statemachine-lint --spec-dir docs/spec
        language: system
        pass_filenames: false
        files: ^docs/spec/.*\.md$
