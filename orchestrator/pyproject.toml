[project]
name = "orchestrator"
version = "0.0.1"
description = "Agent Session Orchestrator — drives the Agent HQ agent chain."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4", "pre-commit>=3"]

[project.scripts]
orchestrate = "orchestrator.cli:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9.0",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.1.4",  # For GitHub-Flavored-Markdown (Tables etc.)
    "mdformat-ruff>=0.1.3", # Uses Ruff in mdformat for Python-Codeblocks
    "mdformat-frontmatter>=2.1.2" # Protects the yaml frontmatter blocks
]

[tool.pytest.ini_options]
markers = ["live: hits the real copilot CLI (skipped unless RUN_LIVE=1)"]
