# Project-scoped pre-commit gate for the orchestrator.
#
# This is the DEVELOPMENT config for the agent_hq monorepo. Paths are
# repo-root-relative (prefixed with orchestrator/).
#
# The TEMPLATE for new projects is orchestrator/pre-commit-config.yaml —
# that file uses project-root-relative paths and is copied by `orchestrate init`.
# Both configs MUST define the same hooks. Keep them in sync.
#
# Root .pre-commit-config.yaml also defines these hooks with an -orchestrator
# suffix. This file exists separately so a contributor can run orchestrator-only
# gates in isolation, without the rest of the monorepo's hooks executing or
# needing their tools installed.
#
# Usage from repo root:
#   pre-commit run -c orchestrator/.pre-commit-config.yaml --all-files
repos:
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        # --project pins uv to the orchestrator project explicitly. Without it,
        # uv walks up from the repo root (which has no pyproject.toml) looking
        # for a project/venv and can pick up an unrelated sibling .venv.
        entry: uv run --project orchestrator mdformat --number
        language: system
        types: [markdown]

      - id: ruff-check
        name: ruff check
        entry: uv run --project orchestrator ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: ruff format
        entry: uv run --project orchestrator ruff format
        language: system
        types_or: [python, pyi, jupyter]

      - id: arch-lint
        name: arch-lint (arc42 <-> Structurizr consistency)
        entry: python3 factory/scripts/arch-lint --docs-dir orchestrator/docs --no-validate
        language: system
        pass_filenames: false
        files: ^orchestrator/docs/(architecture\.dsl|05_building_block_view\.md|assets/images/.*)$

      - id: backlog-lint
        name: backlog-lint (story schema & traceability gate)
        entry: python3 factory/scripts/backlog-lint --backlog-dir orchestrator/backlog
        language: system
        pass_filenames: false
        files: ^orchestrator/backlog/ST-.*\.md$

      - id: matrix-lint
        name: matrix-lint (model matrix consistency gate)
        entry: python3 factory/scripts/matrix-lint --matrix orchestrator/model-matrix.conf
        language: system
        pass_filenames: false
        files: ^orchestrator/model-matrix\.conf$

      - id: statemachine-lint
        name: statemachine-lint (pseudocode ↔ Mermaid consistency)
        entry: python3 factory/scripts/statemachine-lint --spec-dir orchestrator/docs/spec
        language: system
        pass_filenames: false
        files: ^orchestrator/docs/spec/.*\.md$
