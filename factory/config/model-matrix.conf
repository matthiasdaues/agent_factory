# Model Matrix — Agent Session Orchestrator
#
# Operator-curated artifact (ADR-0009, FR-K5). Two sections:
# [facts]  — per-CLI model bindings (change when models are added/retired)
# [policy] — CLI-agnostic tier assignments (change when budget stance shifts)
#
# Validated by matrix-lint; consumed by ModelResolver at run time.
# Precedence: --model flag > matrix > adapter default (FR-K3).

[facts]
# Copilot CLI (MVP adapter)
copilot.economy  = gpt-5.4-mini
copilot.standard = gpt-5.4
copilot.strong   = claude-opus-4-6

[policy]
# Classification → tier (BR-021)
class.trivial  = economy
class.standard = standard
class.hard     = strong

# Phase defaults (non-task phases, or override for task phases)
phase.requirements     = strong
phase.architecture     = strong
phase.planning         = strong
phase.implementation   = by-class

# Fallback when a tier has no model for the active CLI (FR-K4, BR-020)
on_missing = halt
