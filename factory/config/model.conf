# Model Config — Agent Session Orchestrator
#
# Operator-curated per-CLI tier router (ADR-0020, ADR-0021). A tier is
# either configured for the active CLI, in [facts], or it isn't — there
# is no policy layer to resolve it through.
#
# Validated by matrix-lint; consumed by ModelResolver at run time.
# Precedence: --model flag > model.conf > adapter default (FR-K3).

[facts]
# Copilot CLI (MVP adapter)
copilot.economy  = gpt-5.4-mini
copilot.standard = gpt-5.4
copilot.strong   = claude-opus-4-6

# Pi via OpenRouter (ADR-0005). Operator-curated; validate/refresh with
# `factory/scripts/openrouter-discover --check` (drift) / `--suggest` (picks).
# Consumed by `resolve-model` for the `run_agent` tool (UC-10).
pi.economy  = openrouter/anthropic/claude-haiku-4.5
pi.standard = openrouter/anthropic/claude-sonnet-4.6
pi.strong   = openrouter/anthropic/claude-opus-4.8

# Fallback when a tier has no model for the active CLI (FR-K4, BR-020)
on_missing = halt
