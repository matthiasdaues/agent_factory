# Pre-commit hooks for the agent_factory source repository.
#
# Two blocks: the first (agent_factory_hook-*) is what init-factory
# installs in consumer projects. The second (unprefixed) is this
# repo's own development hooks. Both run here.
#
# Every hook uses factory/scripts/ — the installed tool copy at root,
# not the source under packages/factory/. Language-specific linters
# (ruff, eslint, etc.) are not included; add them per project during
# onboarding.

repos:
  # ── Consumer hooks (installed by init-factory) ─────────────────
  - repo: local
    hooks:
      # Normalize markdown formatting (headings, lists, tables).
      # Prevents style drift across authors and agents.
      - id: agent_factory_hook-mdformat
        name: "agent_factory: mdformat"
        entry: factory/scripts/mdformat --number
        language: system
        types: [markdown]

      # Verify that relative links between markdown files resolve.
      # Catches renames, moves, and typos before they reach review.
      - id: agent_factory_hook-link-check
        name: "agent_factory: link-check (local Markdown links)"
        entry: factory/scripts/link-check
        language: system
        types: [markdown]
        exclude: ^(packages/factory/|docs/~archive/)

      # Flag raw semicolons inside mermaid code fences.
      # Mermaid silently swallows them, producing broken diagrams.
      - id: agent_factory_hook-mermaid-lint
        name: "agent_factory: mermaid-lint (no raw semicolons)"
        entry: factory/scripts/mermaid-lint
        language: system
        types: [markdown]

      # Check specification files for internal consistency:
      # cross-references, required sections, traceability IDs.
      - id: agent_factory_hook-spec-lint
        name: "agent_factory: spec-lint (specification consistency & traceability)"
        entry: factory/scripts/spec-lint
        language: system
        pass_filenames: false
        files: ^docs/spec/

      # Check arc42 docs against the Structurizr DSL workspace.
      # Catches component names that diverge between prose and model.
      - id: agent_factory_hook-arch-lint
        name: "agent_factory: arch-lint (arc42 <-> Structurizr consistency, ADR frontmatter)"
        entry: factory/scripts/arch-lint --docs-dir docs/arc42 --no-validate
        language: system
        pass_filenames: false
        files: ^docs/(arc42/(architecture\.dsl|05_building_block_view\.md)|assets/images/.*|adr/.*\.md)$

      # Validate backlog story frontmatter (required fields, status
      # values, dependency references) and traceability to specs.
      - id: agent_factory_hook-backlog-lint
        name: "agent_factory: backlog-lint (story schema & traceability gate)"
        entry: factory/scripts/backlog-lint --backlog-dir backlog
        language: system
        pass_filenames: false
        files: ^backlog/ST-.*\.md$

      # Validate agent-context YAML files (stack, workflow,
      # governance) against their schemas.
      - id: agent_factory_hook-context-lint
        name: "agent_factory: context-lint (agent-context CX-* validation gate)"
        entry: factory/scripts/context-lint
        language: system
        pass_filenames: false
        files: ^docs/agent-context/.*\.yaml$

      # Check the model matrix for internal consistency:
      # tier names, model IDs, and required columns.
      - id: agent_factory_hook-matrix-lint
        name: "agent_factory: matrix-lint (model matrix consistency gate)"
        entry: factory/scripts/matrix-lint --matrix config/model.conf
        language: system
        pass_filenames: false
        files: ^config/model\.conf$

      # Check that pseudocode and Mermaid state diagrams in spec
      # files describe the same transitions.
      - id: agent_factory_hook-statemachine-lint
        name: "agent_factory: statemachine-lint (pseudocode <-> Mermaid consistency)"
        entry: factory/scripts/statemachine-lint --spec-dir docs/spec
        language: system
        pass_filenames: false
        files: ^docs/spec/.*\.md$

      # Regenerate INDEX.yaml from agent/skill/playbook frontmatter.
      # Keeps the routing index in sync with the actual files.
      - id: agent_factory_hook-index-lint
        name: "agent_factory: index-lint (regenerate INDEX.yaml from agent/skill/playbook frontmatter)"
        entry: factory/scripts/index-lint
        language: system
        pass_filenames: false
        files: ^(packages/factory/agents/.*\.md|packages/factory/skills/.*/SKILL\.md|packages/factory/playbooks/.*\.md)$

      # Enforce playbook phase ordering. Blocks commits that skip
      # or reorder phases in the FSM. Inspects all staged files,
      # so it always runs — no-op when no phase marker is staged.
      - id: agent_factory_hook-transition-lint
        name: "agent_factory: transition-lint (playbook phase-ordering gate)"
        entry: factory/scripts/transition-lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

  # ── Development hooks (this repo only) ─────────────────────────
  - repo: local
    hooks:
      # Same as above, without the agent_factory_hook- prefix.
      # Duplicated so this repo's own commits also pass the gates
      # when the consumer block is not installed by init-factory.

      - id: mdformat
        name: mdformat
        entry: factory/scripts/mdformat --number
        language: system
        types: [markdown]

      - id: link-check
        name: link-check (local Markdown links)
        entry: factory/scripts/link-check
        language: system
        types: [markdown]
        exclude: ^(packages/factory/|docs/~archive/)

      - id: spec-lint
        name: spec-lint (specification consistency & traceability)
        entry: factory/scripts/spec-lint
        language: system
        pass_filenames: false
        files: ^docs/spec/

      - id: arch-lint
        name: arch-lint (arc42 <-> Structurizr consistency, ADR frontmatter)
        entry: factory/scripts/arch-lint --docs-dir docs/arc42 --no-validate
        language: system
        pass_filenames: false
        files: ^docs/(arc42/(architecture\.dsl|05_building_block_view\.md)|assets/images/.*|adr/.*\.md)$

      - id: backlog-lint
        name: backlog-lint (story schema & traceability gate)
        entry: factory/scripts/backlog-lint --backlog-dir backlog
        language: system
        pass_filenames: false
        files: ^backlog/ST-.*\.md$

      - id: context-lint
        name: context-lint (agent-context CX-* validation gate)
        entry: factory/scripts/context-lint
        language: system
        pass_filenames: false
        files: ^docs/agent-context/.*\.yaml$

      - id: matrix-lint
        name: matrix-lint (model matrix consistency gate)
        entry: factory/scripts/matrix-lint --matrix config/model.conf
        language: system
        pass_filenames: false
        files: ^config/model\.conf$

      - id: statemachine-lint
        name: statemachine-lint (pseudocode ↔ Mermaid consistency)
        entry: factory/scripts/statemachine-lint --spec-dir docs/spec
        language: system
        pass_filenames: false
        files: ^docs/spec/.*\.md$

      - id: index-lint
        name: index-lint (regenerate INDEX.yaml from agent/skill/playbook/rulebook frontmatter)
        entry: factory/scripts/index-lint
        language: system
        pass_filenames: false
        files: ^(packages/factory/agents/.*\.md|packages/factory/skills/.*/SKILL\.md|packages/factory/playbooks/.*\.md|packages/factory/rulebooks/(?!templates/).*\.md)$

      - id: transition-lint
        name: transition-lint (playbook phase-ordering gate)
        entry: factory/scripts/transition-lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      # Run the test suite when factory scripts or tests change.
      - id: run-tests
        name: run-tests
        entry: uv run pytest --tb=short --quiet
        language: system
        pass_filenames: false
        files: ^(packages/factory/scripts/|tests?/)
