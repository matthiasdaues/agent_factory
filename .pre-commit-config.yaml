# Pre-commit hooks for the agent_factory monorepo.
#
# This is a real, merged file — not a symlink. It combines two halves:
#   1. Agent Factory's generic hooks (originally
#      factory/config/pre-commit-config.yaml) — mdformat/ruff via `uvx`, plus
#      spec-lint/arch-lint/backlog-lint/matrix-lint/statemachine-lint/
#      index-lint pointed at root-level docs/backlog paths. These stay inert
#      until factory grows its own docs/backlog, and now exclude
#      orchestrator/ so they don't double-touch its files with unpinned
#      tool versions.
#   2. orchestrator's own dev hooks (originally orchestrator/.pre-commit-
#      config.yaml), namespaced with an `-orchestrator` suffix and scoped to
#      `orchestrator/`, invoking the pinned `uv run --project orchestrator`
#      toolchain for mdformat/ruff, and factory/scripts/<name> (not the
#      stale bare scripts/<name>) for the *-lint gates.
#
# See docs/adr/0001-precommit-monorepo-scoping.md (not orchestrator's own
# ADR-0003, a different decision — see that ADR's own note on the numbering
# collision).
repos:
  - repo: local
    hooks:
      # formats all markdown files — zero local install, see factory/scripts/mdformat
      - id: agent_factory_hook-mdformat
        name: "agent_factory: mdformat"
        entry: factory/scripts/mdformat --number
        language: system
        types: [markdown]

      # lints all python files (skip if the project isn't Python) — zero local install, via uvx
      - id: agent_factory_hook-ruff-check
        name: "agent_factory: ruff check"
        entry: uvx ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]

      # lints python code blocks in markdown — zero local install, via uvx
      - id: agent_factory_hook-ruff-format
        name: "agent_factory: ruff format"
        entry: uvx ruff format
        language: system
        types_or: [python, pyi, jupyter]

      - id: agent_factory_hook-link-check
        name: "agent_factory: link-check (local Markdown links)"
        entry: factory/scripts/link-check
        language: system
        types: [markdown]
        exclude: ^factory/

      - id: agent_factory_hook-spec-lint
        name: "agent_factory: spec-lint (specification consistency & traceability)"
        entry: factory/scripts/spec-lint
        language: system
        pass_filenames: false
        files: ^docs/spec/

      - id: agent_factory_hook-arch-lint
        name: "agent_factory: arch-lint (arc42 <-> Structurizr consistency, ADR frontmatter)"
        entry: factory/scripts/arch-lint --docs-dir docs/arc42 --no-validate
        language: system
        pass_filenames: false
        files: ^docs/(arc42/(architecture\.dsl|05_building_block_view\.md)|assets/images/.*|adr/.*\.md)$

      - id: agent_factory_hook-backlog-lint
        name: "agent_factory: backlog-lint (story schema & traceability gate)"
        entry: factory/scripts/backlog-lint --backlog-dir backlog
        language: system
        pass_filenames: false
        files: ^backlog/ST-.*\.md$

      - id: agent_factory_hook-matrix-lint
        name: "agent_factory: matrix-lint (model matrix consistency gate)"
        entry: factory/scripts/matrix-lint --matrix config/model.conf
        language: system
        pass_filenames: false
        files: ^config/model\.conf$

      - id: agent_factory_hook-statemachine-lint
        name: "agent_factory: statemachine-lint (pseudocode <-> Mermaid consistency)"
        entry: factory/scripts/statemachine-lint --spec-dir docs/spec
        language: system
        pass_filenames: false
        files: ^docs/spec/.*\.md$

      - id: agent_factory_hook-index-lint
        name: "agent_factory: index-lint (regenerate INDEX.yaml from agent/skill/playbook frontmatter)"
        entry: factory/scripts/index-lint
        language: system
        pass_filenames: false
        files: ^(factory/agents/.*\.md|factory/skills/.*/SKILL\.md|factory/playbooks/.*\.md)$

      # governs phase ORDERING between playbook states (not artifact validity);
      # inspects everything staged, so it always runs — no-op without a marker
      - id: agent_factory_hook-transition-lint
        name: "agent_factory: transition-lint (playbook phase-ordering gate)"
        entry: factory/scripts/transition-lint
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      # formats all markdown files — zero local install, see factory/scripts/mdformat
      - id: mdformat
        name: mdformat
        entry: factory/scripts/mdformat --number
        language: system
        types: [markdown]
        exclude: ^orchestrator/

      # lints all python files (skip if the project isn't Python) — zero local install, via uvx
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        exclude: ^orchestrator/

      # lints python code blocks in markdown — zero local install, via uvx
      - id: ruff-format
        name: ruff format
        entry: uvx ruff format
        language: system
        types_or: [python, pyi, jupyter]
        exclude: ^orchestrator/

      - id: link-check
        name: link-check (local Markdown links)
        entry: factory/scripts/link-check
        language: system
        types: [markdown]
        exclude: ^(factory|orchestrator)/

      - id: spec-lint
        name: spec-lint (specification consistency & traceability)
        entry: factory/scripts/spec-lint
        language: system
        pass_filenames: false
        files: ^docs/spec/

      - id: arch-lint
        name: arch-lint (arc42 <-> Structurizr consistency, ADR frontmatter)
        entry: factory/scripts/arch-lint --docs-dir docs/arc42 --no-validate
        language: system
        pass_filenames: false
        files: ^docs/(arc42/(architecture\.dsl|05_building_block_view\.md)|assets/images/.*|adr/.*\.md)$

      - id: backlog-lint
        name: backlog-lint (story schema & traceability gate)
        entry: factory/scripts/backlog-lint --backlog-dir backlog
        language: system
        pass_filenames: false
        files: ^backlog/ST-.*\.md$

      - id: matrix-lint
        name: matrix-lint (model matrix consistency gate)
        entry: factory/scripts/matrix-lint --matrix config/model.conf
        language: system
        pass_filenames: false
        files: ^config/model\.conf$

      - id: statemachine-lint
        name: statemachine-lint (pseudocode ↔ Mermaid consistency)
        entry: factory/scripts/statemachine-lint --spec-dir docs/spec
        language: system
        pass_filenames: false
        files: ^docs/spec/.*\.md$

      - id: index-lint
        name: index-lint (regenerate INDEX.yaml from agent/skill/playbook/rulebook frontmatter)
        entry: factory/scripts/index-lint
        language: system
        pass_filenames: false
        files: ^(factory/agents/.*\.md|factory/skills/.*/SKILL\.md|factory/playbooks/.*\.md|factory/rulebooks/(?!templates/).*\.md)$

      # governs phase ORDERING between playbook states (not artifact validity);
      # inspects everything staged, so it always runs — no-op without a marker
      - id: transition-lint
        name: transition-lint (playbook phase-ordering gate)
        entry: factory/scripts/transition-lint
        language: system
        pass_filenames: false
        always_run: true

      # UC-09, BR-029: Run tests only when src/ or test/ code changes
      - id: run-tests
        name: run-tests (changed-only mode)
        entry: factory/scripts/run-tests --changed-only
        language: system
        pass_filenames: false
        files: ^(src/|tests?/)

      # --- orchestrator-scoped hooks below (dev config for this monorepo) ---

      - id: mdformat-orchestrator
        name: mdformat (orchestrator)
        entry: factory/scripts/mdformat --number
        language: system
        types: [markdown]
        files: ^orchestrator/

      - id: ruff-check-orchestrator
        name: ruff check (orchestrator)
        entry: uvx ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        files: ^orchestrator/

      - id: ruff-format-orchestrator
        name: ruff format (orchestrator)
        entry: uvx ruff format
        language: system
        types_or: [python, pyi, jupyter]
        files: ^orchestrator/

      - id: spec-lint-orchestrator
        name: spec-lint (specification consistency & traceability, orchestrator)
        entry: factory/scripts/spec-lint --spec-dir orchestrator/docs/spec
        language: system
        pass_filenames: false
        files: ^orchestrator/docs/spec/

      - id: arch-lint-orchestrator
        name: arch-lint (arc42 <-> Structurizr consistency, orchestrator)
        entry: factory/scripts/arch-lint --docs-dir orchestrator/docs --no-validate
        language: system
        pass_filenames: false
        files: ^orchestrator/docs/(architecture\.dsl|05_building_block_view\.md|assets/images/.*)$

      - id: backlog-lint-orchestrator
        name: backlog-lint (story schema & traceability gate, orchestrator)
        entry: factory/scripts/backlog-lint --backlog-dir orchestrator/backlog
        language: system
        pass_filenames: false
        files: ^orchestrator/backlog/ST-.*\.md$

      - id: matrix-lint-orchestrator
        name: matrix-lint (model matrix consistency gate, orchestrator)
        entry: factory/scripts/matrix-lint --matrix orchestrator/model.conf
        language: system
        pass_filenames: false
        files: ^orchestrator/model\.conf$

      - id: statemachine-lint-orchestrator
        name: statemachine-lint (pseudocode ↔ Mermaid consistency, orchestrator)
        entry: factory/scripts/statemachine-lint --spec-dir orchestrator/docs/spec
        language: system
        pass_filenames: false
        files: ^orchestrator/docs/spec/.*\.md$
