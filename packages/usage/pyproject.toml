[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usage"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["duckdb"]

[project.optional-dependencies]
arrow = ["pyarrow>=15.0.0,<20"]

[project.scripts]
usage-query = "usage.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "pytest",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usage"]

[tool.coverage.run]
source_pkgs = ["usage"]
parallel = true
branch = true

[tool.coverage.paths]
source = ["src/usage"]

[tool.coverage.report]
show_missing = true
