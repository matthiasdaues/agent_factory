# Agent Factory pre-commit hooks — installed into consumer projects.
#
# init-factory splices this block into the project's .pre-commit-config.yaml.
# remove-factory strips it back out.
#
# PREFIX: every hook id starts with `agent_factory_hook-`. That prefix is
# the removal key — do not rename it.
#
# FACTORY GUARD: hooks calling factory/scripts/* are wrapped in
#   bash -c '[ -d factory ] || exit 0; exec factory/scripts/…'
# so teammates who don't have the factory installed can still commit.
# The tracked .pre-commit-config.yaml reaches them; the untracked
# factory/ directory does not.
#
# LANGUAGE LINTERS: not included. Add project-specific linters (ruff,
# eslint, checkstyle, etc.) during onboarding — they belong to the
# project, not to the factory.

repos:
  - repo: local
    hooks:
      # Normalize markdown formatting (headings, lists, tables).
      # Prevents style drift across authors and agents.
      - id: agent_factory_hook-mdformat
        name: "agent_factory: mdformat"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/mdformat --number "$@"' --
        language: system
        types: [markdown]

      # Verify that relative links between markdown files resolve.
      # Catches renames, moves, and typos before they reach review.
      - id: agent_factory_hook-link-check
        name: "agent_factory: link-check (local Markdown links)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/link-check "$@"' --
        language: system
        types: [markdown]
        exclude: ^(factory/|docs/~archive/)

      # Flag raw semicolons inside Mermaid code fences.
      # Mermaid silently swallows them, producing broken diagrams.
      - id: agent_factory_hook-mermaid-lint
        name: "agent_factory: mermaid-lint (no raw semicolons)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/mermaid-lint "$@"' --
        language: system
        types: [markdown]

      # Validate Gherkin feature files and supplementary specs in
      # docs/spec/ — required sections, cross-references between
      # files, and traceability IDs that link specs to stories.
      - id: agent_factory_hook-spec-lint
        name: "agent_factory: spec-lint (specification consistency & traceability)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/spec-lint' --
        language: system
        pass_filenames: false
        files: ^docs/spec/

      # Compare architecture documentation against the C4 model
      # (the Structurizr DSL file). Catches names that appear in
      # one but not the other. Also validates ADR frontmatter.
      - id: agent_factory_hook-arch-lint
        name: "agent_factory: arch-lint (arc42 <-> Structurizr consistency, ADR frontmatter)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/arch-lint --docs-dir docs/arc42 --no-validate' --
        language: system
        pass_filenames: false
        files: ^docs/(arc42/(architecture\.dsl|05_building_block_view\.md)|assets/images/.*|adr/.*\.md)$

      # Validate backlog story files — required frontmatter fields,
      # allowed status values, and dependency references that must
      # point to existing stories.
      - id: agent_factory_hook-backlog-lint
        name: "agent_factory: backlog-lint (story schema & traceability gate)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/backlog-lint --backlog-dir backlog' --
        language: system
        pass_filenames: false
        files: ^backlog/ST-.*\.md$

      # Validate the YAML files in docs/agent-context/ where the
      # project declares its tech stack, workflow, and governance
      # decisions. Agents read these to adapt their behavior.
      - id: agent_factory_hook-context-lint
        name: "agent_factory: context-lint (agent-context validation gate)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/context-lint' --
        language: system
        pass_filenames: false
        files: ^docs/agent-context/.*\.yaml$

      # Validate config/model.conf — the file that maps agent roles
      # to AI models and cost tiers. Checks for missing columns,
      # unknown tier names, and duplicate entries.
      - id: agent_factory_hook-matrix-lint
        name: "agent_factory: matrix-lint (model matrix consistency gate)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/matrix-lint --matrix config/model.conf' --
        language: system
        pass_filenames: false
        files: ^config/model\.conf$

      # When a spec file contains both pseudocode and a Mermaid state
      # diagram, verify they describe the same states and transitions.
      - id: agent_factory_hook-statemachine-lint
        name: "agent_factory: statemachine-lint (pseudocode <-> Mermaid consistency)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/statemachine-lint --spec-dir docs/spec' --
        language: system
        pass_filenames: false
        files: ^docs/spec/.*\.md$

      # Regenerate INDEX.yaml whenever agent, skill, or playbook
      # files change. INDEX.yaml is the routing table that tells
      # each CLI where to find factory content.
      - id: agent_factory_hook-index-lint
        name: "agent_factory: index-lint (regenerate INDEX.yaml)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/index-lint' --
        language: system
        pass_filenames: false
        files: ^(factory/agents/.*\.md|factory/skills/.*/SKILL\.md|factory/playbooks/.*\.md)$

      # Enforce playbook phase ordering. A playbook moves through
      # phases in a fixed sequence (requirements → architecture →
      # planning → implementation → QA). This blocks commits that
      # skip or reorder phases. Inspects all staged files, so it
      # always runs — no-op when no phase marker is staged.
      - id: agent_factory_hook-transition-lint
        name: "agent_factory: transition-lint (playbook phase-ordering gate)"
        entry: bash -c '[ -d factory ] || exit 0; exec factory/scripts/transition-lint' --
        language: system
        pass_filenames: false
        always_run: true
