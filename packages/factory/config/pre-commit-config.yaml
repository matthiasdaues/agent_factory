---
# Agent Factory pre-commit hooks — installed into consumer projects.
#
# init-factory splices this block into the project's .pre-commit-config.yaml.
# remove-factory strips it back out.
#
# PREFIX: every hook id starts with `agent_factory_hook-`. That prefix is
# the removal key — do not rename it.
#
# FACTORY GUARD: hooks calling .agent-factory/factory/scripts/* first look
# for .agent-factory/ in the current checkout, then in the main checkout
# (a linked worktree has no copy of its own), and exit 0 only when neither
# has it, so teammates who don't have the factory installed can still commit.
# The tracked .pre-commit-config.yaml reaches them; the untracked
# .agent-factory/ directory does not. Hooks that only check use `exec`;
# hooks that modify files (mdformat, arch-lint) drop `exec` to
# chain `git add` and stage the results.
#
# LANGUAGE LINTERS: not included. Add project-specific linters (ruff,
# eslint, checkstyle, etc.) during onboarding — they belong to the
# project, not to the factory.

repos:
  - repo: local
    hooks:
      # Normalize markdown formatting (headings, lists, tables).
      # Prevents style drift across authors and agents.
      - id: agent_factory_hook-mdformat
        name: "agent_factory: mdformat"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; "$AF"/factory/scripts/mdformat
          --number "$@"; rc=$?; git add "$@" 2>/dev/null; exit $rc' --
        language: system
        types: [markdown]
        stages: [pre-commit, pre-merge-commit]

      # Verify that relative links between markdown files resolve.
      # Catches renames, moves, and typos before they reach review.
      - id: agent_factory_hook-link-check
        name: "agent_factory: link-check (local Markdown links)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/link-check "$@"' --
        language: system
        types: [markdown]
        exclude: ^(\.agent-factory/factory/|docs/~archive/)

      # Flag raw semicolons inside Mermaid code fences.
      # Mermaid silently swallows them, producing broken diagrams.
      - id: agent_factory_hook-mermaid-lint
        name: "agent_factory: mermaid-lint (no raw semicolons)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/mermaid-lint "$@"' --
        language: system
        types: [markdown]

      # Validate Gherkin feature files and supplementary specs in
      # docs/spec/ — required sections, cross-references between
      # files, and traceability IDs that link specs to stories.
      - id: agent_factory_hook-spec-lint
        name: "agent_factory: spec-lint (spec consistency & traceability)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/spec-lint' --
        language: system
        pass_filenames: false
        files: ^docs/spec/

      # Compare chapter 5 in docs/arc42/ against the C4 model
      # (docs/spec/architecture.dsl). Catches names that appear in
      # one but not the other. Also validates ADR frontmatter.
      - id: agent_factory_hook-arch-lint
        name: "agent_factory: arch-lint (arc42, Structurizr, ADR frontmatter)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; };
          "$AF"/factory/scripts/arch-lint --dsl docs/spec/architecture.dsl
          --docs-dir docs/arc42 --no-validate --allow-missing-docs-dir; rc=$?;
          git add docs/assets/images/*.svg 2>/dev/null; exit $rc'
        language: system
        pass_filenames: false
        files: >-
          ^docs/(spec/(architecture|dependency-rules)\.dsl|arc42/05_building_block_view\.md|assets/images/.*|adr/.*\.md)$
        stages: [pre-commit, pre-merge-commit]

      # Validate backlog story files — required frontmatter fields,
      # allowed status values, and dependency references that must
      # point to existing stories.
      - id: agent_factory_hook-backlog-lint
        name: "agent_factory: backlog-lint (story schema & traceability gate)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/backlog-lint --backlog-dir backlog "$@"' --
        language: system
        pass_filenames: false
        files: ^backlog/ST-.*\.md$

      # Validate docs/agent-context.md — the concern-based routing
      # interface between agents and project knowledge.
      - id: agent_factory_hook-concern-lint
        name: "agent_factory: concern-lint (agent-context validation gate)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/concern-lint' --
        language: system
        pass_filenames: false
        files: ^docs/agent-context\.md$

      # Validate config/model.conf — the file that maps agent roles
      # to AI models and cost tiers. Checks for missing columns,
      # unknown tier names, and duplicate entries.
      - id: agent_factory_hook-matrix-lint
        name: "agent_factory: matrix-lint (model matrix consistency gate)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/matrix-lint --matrix "$AF"/config/model.conf' --
        language: system
        pass_filenames: false
        files: ^\.agent-factory/config/model\.conf$

      # When a spec file contains both pseudocode and a Mermaid state
      # diagram, verify they describe the same states and transitions.
      - id: agent_factory_hook-statemachine-lint
        name: "agent_factory: statemachine-lint (pseudocode <-> Mermaid)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/statemachine-lint --spec-dir docs/spec' --
        language: system
        pass_filenames: false
        files: ^docs/spec/.*\.md$

      # Check the recorded values of every finding in docs/findings/ against
      # the classification rules. Reads the staged version of each file, so a
      # commit that records a wrong severity, or lowers a critical finding
      # without the override fields, exits 1. Runs on every commit, because
      # pre-commit leaves deleted paths out of its file list, and removing an
      # open finding must fail.
      - id: agent_factory_hook-finding-lint
        name: "agent_factory: finding-lint (finding classification gate)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/finding-lint --staged' --
        language: system
        pass_filenames: false
        always_run: true

      # Regenerate INDEX.yaml whenever agent, skill, or playbook
      # files change. INDEX.yaml is the routing table that tells
      # each CLI where to find factory content.
      - id: agent_factory_hook-index-lint
        name: "agent_factory: index-lint (regenerate INDEX.yaml)"
        entry: >-
          bash -c 'AF=.agent-factory; [ -d "$AF" ] || AF="$(cd "$(git rev-parse
          --git-common-dir 2>/dev/null)/.." 2>/dev/null && pwd)/.agent-factory";
          [ -d "$AF" ] || { [ "$(git config --bool agent-factory.installed)" =
          true ] || exit 0; echo ".agent-factory/ missing. Run update-factory,
          or set SKIP=<hook id>." >&2; exit 1; }; exec
          "$AF"/factory/scripts/index-lint' --
        language: system
        pass_filenames: false
        files: >-
          ^(\.agent-factory/factory/agents/.*\.md|\.agent-factory/factory/skills/.*/SKILL\.md|\.agent-factory/factory/playbooks/.*\.md)$
        stages: [pre-commit, pre-merge-commit]
